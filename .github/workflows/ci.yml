name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: validator tests + 样例校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: 运行 validator 单测
        run: npm test

      - name: 校验 jwxt-lite 样例数据
        run: npm run validate -- examples/jwxt-lite

      - name: 校验 minimal 样例数据
        run: npm run validate -- examples/minimal
