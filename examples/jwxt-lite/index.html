<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GanttMD</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1a1d23;
  --muted: #6b7280;
  --border: #e2e5ea;
  --todo: #3b82f6;
  --progress: #f59e0b;
  --done: #10b981;
  --blocked: #ef4444;
  --accent: #6366f1;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

/* Header */
.header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.header h1 { font-size: 20px; font-weight: 700; }
.header .sub { color: var(--muted); font-size: 13px; }
.pick-btn { background: #1f2937; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
.pick-btn:hover { background: #374151; }

/* Summary strip */
.summary { display: flex; gap: 1px; background: var(--border); }
.summary .cell { flex: 1; background: var(--panel); padding: 14px 20px; text-align: center; }
.summary .cell .num { font-size: 28px; font-weight: 700; line-height: 1.2; }
.summary .cell .lbl { color: var(--muted); font-size: 12px; }

/* Milestone timeline */
.ms-section { padding: 24px 28px 0; }
.ms-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
.ms-track { display: flex; align-items: stretch; gap: 0; position: relative; }
.ms-node { flex: 1; position: relative; padding: 0 8px; }
.ms-card { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; padding: 14px 16px; position: relative; z-index: 1; transition: border-color .2s; }
.ms-node.active .ms-card { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
.ms-node.completed .ms-card { border-color: var(--done); }
.ms-card .ms-id { font-weight: 700; font-size: 16px; }
.ms-card .ms-name { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ms-bar { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-top: 10px; }
.ms-bar span { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
.ms-node.completed .ms-bar span { background: var(--done); }
.ms-node.active .ms-bar span { background: var(--accent); }
.ms-node.backlog .ms-bar span { background: #d1d5db; }
.ms-pct { font-size: 12px; font-weight: 600; margin-top: 4px; text-align: right; }
.ms-node:not(:last-child)::after { content: ''; position: absolute; top: 28px; right: -1px; width: calc(100% - 16px); height: 3px; background: var(--border); z-index: 0; transform: translateX(50%); }
.ms-node.completed:not(:last-child)::after { background: var(--done); }

/* Main content */
.content { padding: 20px 28px 40px; }

/* Milestone group */
.ms-group { margin-bottom: 32px; }
.ms-group-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.ms-group-header .ms-tag { background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 99px; }
.ms-group-header.completed .ms-tag { background: var(--done); }
.ms-group-header.active .ms-tag { background: var(--accent); }
.ms-group-header.backlog .ms-tag { background: #9ca3af; }
.ms-group-header h3 { font-size: 16px; font-weight: 600; }
.ms-group-header .ms-stats { margin-left: auto; color: var(--muted); font-size: 13px; }

/* Task cards layout */
.task-cards { display: flex; flex-wrap: wrap; gap: 10px; }
.task-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; width: 220px; position: relative; transition: box-shadow .15s; }
.task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.task-card.status-done { border-left: 3px solid var(--done); }
.task-card.status-in_progress { border-left: 3px solid var(--progress); }
.task-card.status-todo { border-left: 3px solid var(--todo); }
.task-card.status-blocked { border-left: 3px solid var(--blocked); background: #fef2f2; }
.task-id { font-size: 12px; font-weight: 700; color: var(--muted); }
.task-name { font-size: 13px; font-weight: 600; margin-top: 2px; line-height: 1.35; }
.task-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; color: #fff; }
.badge.todo { background: var(--todo); }
.badge.in_progress { background: var(--progress); }
.badge.done { background: var(--done); }
.badge.blocked { background: var(--blocked); }
.mod-tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #f0f0f5; color: #555; }
.dep-line { font-size: 11px; color: var(--muted); margin-top: 4px; }
.dep-line.warn { color: var(--blocked); font-weight: 600; }

/* Arrow connector */
.arrow-right { display: flex; align-items: center; color: var(--border); font-size: 18px; padding: 0 2px; margin-top: 12px; }
.arrow-right.done-arrow { color: var(--done); }
.arrow-right.blocked-arrow { color: var(--blocked); }

/* Dependency panel */
.dep-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-top: 8px; }
.dep-panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.dep-graph { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; }
.dep-edge { display: flex; align-items: center; gap: 4px; padding: 3px 8px; background: #f9fafb; border-radius: 6px; border: 1px solid var(--border); }
.dep-edge .arr { color: var(--muted); }
.dep-edge.resolved .arr { color: var(--done); }
.dep-edge.pending .arr { color: var(--blocked); }
.dep-edge .node { font-weight: 600; }
.dep-edge .node.done-node { color: var(--done); }
.dep-edge .node.open-node { color: var(--blocked); }

/* Empty state */
.empty { padding: 60px 24px; text-align: center; color: var(--muted); background: var(--panel); border: 2px dashed var(--border); border-radius: 10px; margin-top: 20px; }

@media (max-width: 700px) {
  .ms-track { flex-direction: column; gap: 8px; }
  .ms-node:not(:last-child)::after { display: none; }
  .task-card { width: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1 id="title">GanttMD</h1>
    <div class="sub" id="subtitle">选择项目的 <code>.ganttmd</code> 目录（或包含它的父目录）查看进度。</div>
  </div>
  <button class="pick-btn" id="pickBtn">选择目录</button>
</div>

<div class="summary" id="summary" style="display:none;"></div>

<div class="ms-section" id="msSection" style="display:none;">
  <h2>里程碑进度</h2>
  <div class="ms-track" id="msTrack"></div>
</div>

<div class="content" id="content">
  <div class="empty" id="emptyState">
    <div style="font-size: 36px;">📂</div>
    <p style="margin-top:8px;"><strong>选择项目目录</strong></p>
    <p>点击右上角「选择目录」按钮，选取包含 <code>.ganttmd/</code> 的项目目录。</p>
  </div>
</div>

<input type="file" id="filePicker" webkitdirectory multiple style="display:none">

<script>
const pickBtn = document.getElementById('pickBtn');
const filePicker = document.getElementById('filePicker');
pickBtn.addEventListener('click', () => filePicker.click());
filePicker.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  const mdFiles = files.filter(f => f.webkitRelativePath.includes('.ganttmd/modules/') && f.name.endsWith('.md'));
  const cfgFile = files.find(f => f.webkitRelativePath.includes('.ganttmd/config.yaml') || f.webkitRelativePath.includes('.ganttmd/config.yml'));

  const modules = [];
  for (const f of mdFiles) modules.push(parseModule(f.webkitRelativePath, await f.text()));
  const config = cfgFile ? parseConfig(await cfgFile.text()) : null;
  renderAll(modules, config);
});

function parseConfig(text) {
  const c = { project: {}, milestones: [] };
  const nm = text.match(/^\s*name:\s*(.+)$/m);
  if (nm) c.project.name = nm[1].trim();
  const blocks = text.split(/^\s+-\s+id:\s*/m).slice(1);
  for (const b of blocks) {
    const lines = b.split('\n');
    const ms = { id: lines[0].trim(), name: '', status: 'backlog', description: '' };
    for (const l of lines.slice(1)) {
      const m = l.match(/^\s+(name|status|description):\s*(.+)$/);
      if (m) ms[m[1]] = m[2].trim();
    }
    if (ms.id.startsWith('M')) c.milestones.push(ms);
  }
  return c;
}

function parseModule(path, text) {
  const titleMatch = text.match(/^#\s+(.+)$/m);
  const title = titleMatch ? titleMatch[1] : path.split('/').pop().replace('.md','');
  const tasks = [];
  const re = /```ganttmd-task\n([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text))) { const t = parseTask(m[1]); t._module = title; tasks.push(t); }
  return { title, path, tasks };
}

function parseTask(raw) {
  const t = {};
  for (const line of raw.split('\n')) {
    const m = line.match(/^([a-zA-Z_]+):\s*(.*)$/);
    if (!m) continue;
    let v = m[2].trim();
    if (v.startsWith('[') && v.endsWith(']')) v = v.slice(1,-1).split(',').map(s=>s.trim()).filter(Boolean);
    t[m[1]] = v;
  }
  t.dependencies = Array.isArray(t.dependencies) ? t.dependencies : [];
  return t;
}

function topoSort(tasks) {
  const ids = new Set(tasks.map(t=>t.id));
  const adj = new Map(), indeg = new Map();
  for (const t of tasks) { adj.set(t.id,[]); indeg.set(t.id,0); }
  for (const t of tasks) for (const d of t.dependencies) {
    if (!ids.has(d)) continue;
    adj.get(d).push(t.id);
    indeg.set(t.id,(indeg.get(t.id)||0)+1);
  }
  const q = [...ids].filter(id=>indeg.get(id)===0), res = [];
  while(q.length){ const n=q.shift(); res.push(n); for(const nb of adj.get(n)||[]){ indeg.set(nb,indeg.get(nb)-1); if(indeg.get(nb)===0) q.push(nb); }}
  for(const id of ids) if(!res.includes(id)) res.push(id);
  return res;
}

function renderAll(modules, config) {
  const allTasks = modules.flatMap(m => m.tasks);
  const byId = new Map(allTasks.map(t => [t.id, t]));
  for (const t of allTasks) {
    t._openDeps = t.dependencies.filter(d => byId.has(d) && byId.get(d).status !== 'done');
    t._missingDeps = t.dependencies.filter(d => !byId.has(d));
    t._effective = (t.status === 'todo' && t._openDeps.length > 0) ? 'blocked' : t.status;
  }

  const order = topoSort(allTasks);
  const orderIdx = new Map(order.map((id,i) => [id,i]));

  const projectName = config?.project?.name || 'GanttMD';
  document.getElementById('title').textContent = projectName;
  document.getElementById('subtitle').textContent = `共 ${allTasks.length} 个任务 · ${modules.length} 个模块`;

  const done = allTasks.filter(t=>t.status==='done').length;
  const prog = allTasks.filter(t=>t.status==='in_progress').length;
  const blocked = allTasks.filter(t=>t._effective==='blocked').length;
  const ready = allTasks.filter(t=>t._effective==='todo').length;

  const summaryEl = document.getElementById('summary');
  summaryEl.style.display = 'flex';
  summaryEl.innerHTML = [
    cell(allTasks.length, '总任务'), cell(done, '已完成', '--done'),
    cell(prog, '进行中', '--progress'), cell(ready, '可执行', '--todo'),
    cell(blocked, '被阻塞', '--blocked'),
  ].join('');

  renderMilestones(config, allTasks);
  renderContent(config, allTasks, modules, byId, orderIdx);
}

function cell(n, label, cv) {
  const s = cv ? `color:var(${cv})` : '';
  return `<div class="cell"><div class="num" style="${s}">${n}</div><div class="lbl">${label}</div></div>`;
}

function renderMilestones(config, tasks) {
  const msSection = document.getElementById('msSection');
  const msTrack = document.getElementById('msTrack');
  if (!config?.milestones?.length) { msSection.style.display='none'; return; }
  msSection.style.display = '';
  msTrack.innerHTML = config.milestones.map(ms => {
    const msTasks = tasks.filter(t => t.milestone === ms.id);
    const doneCnt = msTasks.filter(t => t.status === 'done').length;
    const pct = msTasks.length ? Math.round(doneCnt / msTasks.length * 100) : 0;
    let cls = 'backlog';
    if (pct === 100 && msTasks.length > 0) cls = 'completed';
    else if (ms.status === 'in_progress' || msTasks.some(t => t.status === 'in_progress')) cls = 'active';
    return `<div class="ms-node ${cls}">
      <div class="ms-card">
        <div class="ms-id">${esc(ms.id)}</div>
        <div class="ms-name">${esc(ms.name)}</div>
        <div class="ms-bar"><span style="width:${pct}%"></span></div>
        <div class="ms-pct" style="color:var(--${cls==='completed'?'done':cls==='active'?'accent':'muted'})">${pct}%</div>
      </div>
    </div>`;
  }).join('');
}

function renderContent(config, tasks, modules, byId, orderIdx) {
  const content = document.getElementById('content');
  document.getElementById('emptyState')?.remove();

  const milestones = config?.milestones || [];
  const msIds = milestones.map(m => m.id);
  const groups = new Map();
  for (const id of msIds) groups.set(id, []);
  groups.set('_other', []);
  for (const t of tasks) {
    const key = msIds.includes(t.milestone) ? t.milestone : '_other';
    groups.get(key).push(t);
  }
  for (const [, list] of groups) list.sort((a, b) => (orderIdx.get(a.id) ?? 999) - (orderIdx.get(b.id) ?? 999));

  let html = '';
  for (const msId of [...msIds, '_other']) {
    const list = groups.get(msId);
    if (!list?.length) continue;
    const ms = milestones.find(m => m.id === msId);
    const msName = ms ? ms.name : '其他任务';
    const doneCnt = list.filter(t => t.status === 'done').length;
    const pct = Math.round(doneCnt / list.length * 100);
    let headerCls = 'backlog';
    if (pct === 100) headerCls = 'completed';
    else if (ms?.status === 'in_progress' || list.some(t => t.status === 'in_progress')) headerCls = 'active';

    html += `<div class="ms-group">
      <div class="ms-group-header ${headerCls}">
        <span class="ms-tag">${esc(msId === '_other' ? '?' : msId)}</span>
        <h3>${esc(msName)}</h3>
        <span class="ms-stats">${doneCnt}/${list.length} 完成 · ${pct}%</span>
      </div>
      <div class="task-cards">${renderCards(list, byId)}</div>
    </div>`;
  }

  html += renderDepGraph(tasks, byId);
  content.innerHTML = html;
}

function renderCards(tasks, byId) {
  let html = '';
  for (let i = 0; i < tasks.length; i++) {
    const t = tasks[i];
    const status = t._effective;
    if (i > 0) {
      const prev = tasks[i - 1];
      const isDep = t.dependencies.includes(prev.id);
      if (isDep) {
        const arrowCls = prev.status === 'done' ? 'done-arrow' : 'blocked-arrow';
        html += `<div class="arrow-right ${arrowCls}">→</div>`;
      }
    }
    const depInfo = [];
    if (t._openDeps.length) depInfo.push(`<div class="dep-line warn">⛔ 等待: ${esc(t._openDeps.join(', '))}</div>`);
    if (t._missingDeps.length) depInfo.push(`<div class="dep-line warn">❓ 缺失: ${esc(t._missingDeps.join(', '))}</div>`);
    if (t.dependencies.length && !t._openDeps.length && !t._missingDeps.length) depInfo.push(`<div class="dep-line">✅ ${esc(t.dependencies.join(', '))}</div>`);

    html += `<div class="task-card status-${status}">
      <div class="task-id">${esc(t.id)}</div>
      <div class="task-name">${esc(t.title || '')}</div>
      <div class="task-meta">
        <span class="badge ${status}">${statusLabel(status)}</span>
        <span class="mod-tag">${esc(t._module)}</span>
      </div>
      ${depInfo.join('')}
    </div>`;
  }
  return html;
}

function renderDepGraph(tasks, byId) {
  const edges = [];
  for (const t of tasks) for (const dep of t.dependencies) {
    const resolved = byId.has(dep) && byId.get(dep).status === 'done';
    edges.push({ from: dep, to: t.id, resolved });
  }
  if (!edges.length) return '';
  return `<div class="dep-panel">
    <h2>依赖关系总览</h2>
    <div class="dep-graph">${edges.map(e => {
      const cls = e.resolved ? 'resolved' : 'pending';
      const fromCls = e.resolved ? 'done-node' : '';
      const toCls = e.resolved ? '' : 'open-node';
      return `<div class="dep-edge ${cls}">
        <span class="node ${fromCls}">${esc(e.from)}</span>
        <span class="arr">${e.resolved ? '✓→' : '⏳→'}</span>
        <span class="node ${toCls}">${esc(e.to)}</span>
      </div>`;
    }).join('')}</div>
  </div>`;
}

function statusLabel(s) { return {done:'已完成',in_progress:'进行中',todo:'可执行',blocked:'被阻塞'}[s]||s; }
function esc(v) { return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
