      <span class="metric-pill">${esc(trackLabel(task._track))}</span>
      <span class="metric-pill">${esc(moduleLabel(task._businessModule))}</span>
      ${state.criticalSet.has(task.id) ? `<span class="metric-pill" style="border-color:#c7d2fe;background:#eef2ff;color:var(--accent);font-weight:700;">关键路径</span>` : ''}
    </div>
    <div class="field-grid">
      <div class="field-box">
        <strong>下一步动作</strong>
        <span>${esc(task.next_action || '未填写，当前只能使用通用推进模板。')}</span>
      </div>
      <div class="field-box">
        <strong>验收标准</strong>
        ${renderSmallList(task.acceptance, '未填写验收标准')}
      </div>
      <div class="field-box">
        <strong>来源文档</strong>
        ${renderSmallList(task.source_docs, '未填写来源文档')}
      </div>
    </div>
    ${task.downstream_constraints?.length ? `<div class="constraint-box">
      <strong>⚠ 下游约束 — 实现本任务时必须考虑</strong>
      <ul>${task.downstream_constraints.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    </div>` : ''}
    ${renderEvidenceBlock(task)}
    <div class="agent-command">
      <div class="agent-command-title">
        <span>Agent 指令草案</span>
        <button class="copy-command" type="button" data-task-id="${esc(task.id)}">复制</button>
      </div>
      <pre>${esc(getAgentCommand(task))}</pre>
    </div>
  `;
}

function renderDrawerTaskContent(task) {
  const checklist = getTaskChecklist(task);
  const showAgentCommand = shouldShowAgentCommand(task);
  const openDetails = !checklist;
  return `
    <div class="agent-kicker">当前任务诊断</div>
    <div class="agent-reason">${esc(getTaskDiagnosis(task))}</div>
    ${renderRuntimeOverlayNotice(task)}
    ${checklist ? renderTaskChecklistBlock(checklist) : ''}
    ${showAgentCommand ? renderCollapsedAgentCommand(task) : ''}
    ${renderCollapsedEvidenceBlock(task)}
    ${renderTaskDetailsBlock(task, openDetails)}
  `;
}

function renderRuntimeOverlayNotice(task) {
  if (!task._worktreeBranch) return '';
  return `<div class="runtime-overlay-note">
    <strong>分支运行态：</strong>${esc(task._worktreeBranch)} 正在承接此任务。任务定义、依赖和验收仍以主分支为准；worktree 只记录领取批次、任务清单和 open follow-up。
  </div>`;
}

function getTaskChecklist(task) {
  if (task._checklist?.items?.length) return task._checklist;
  return (state.runtime?.checklists || []).find(checklist =>
    checklist.taskId === task.id && checklist.items?.length
  );
}

function renderTaskChecklistBlock(checklist) {
  return `<details class="drawer-details checklist-details" open>
    <summary>任务清单 · ${Number(checklist.done) || 0}/${Number(checklist.total) || checklist.items.length} 完成</summary>
    <div class="drawer-details-body">
      <div class="checklist-list">
        ${checklist.items.map(renderChecklistItem).join('')}
      </div>
    </div>
  </details>`;
}

function renderChecklistItem(item) {
  const status = item.status || 'todo';
  const evidence = Array.isArray(item.evidence) ? item.evidence : [];
  const meta = [
    ...evidence.map(value => `证据：${value}`),
    item.blocker_reason ? `阻塞：${item.blocker_reason}` : '',
  ].filter(Boolean);
  return `<div class="checklist-item">
    <span class="checklist-item-id">${esc(item.id || '')}</span>
    <span class="checklist-item-title">${esc(item.title || '未命名检查项')}</span>
    <span class="dep-status ${esc(status)}">${esc(checklistStatusLabel(status))}</span>
    ${meta.length ? `<div class="checklist-item-meta">${meta.map(text => `<span>${esc(text)}</span>`).join('')}</div>` : ''}
  </div>`;
}

function renderTaskDetailsBlock(task, open) {
  return `<details class="drawer-details task-details"${open ? ' open' : ''}>
    <summary>详细信息</summary>
    <div class="drawer-details-body">
      <div class="field-grid">
        <div class="field-box">
          <strong>下一步动作</strong>
          <span>${esc(task.next_action || '未填写，当前只能使用通用推进模板。')}</span>
        </div>
        <div class="field-box">
          <strong>验收标准</strong>
          ${renderSmallList(task.acceptance, '未填写验收标准')}
        </div>
        <div class="field-box">
          <strong>来源文档</strong>
          ${renderSmallList(task.source_docs, '未填写来源文档')}
        </div>
      </div>
      ${task.downstream_constraints?.length ? `<div class="constraint-box">
        <strong>⚠ 下游约束 — 实现本任务时必须考虑</strong>
        <ul>${task.downstream_constraints.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      </div>` : ''}
    </div>
  </details>`;
}

function renderCollapsedAgentCommand(task) {
  const open = shouldOpenAgentCommand(task) ? ' open' : '';
  return `<details class="drawer-details"${open}>
    <summary>Agent 指令草案</summary>
    <div class="drawer-details-body">
      <div class="agent-command" style="margin-top:0;">
        <div class="agent-command-title">
          <span>Agent 指令草案</span>
          <button class="copy-command" type="button" data-task-id="${esc(task.id)}">复制</button>
        </div>
        <pre>${esc(getAgentCommand(task))}</pre>
      </div>
    </div>
  </details>`;
}

function renderCollapsedEvidenceBlock(task) {
  const html = renderEvidenceBlock(task);
  if (!html) return '';
  const open = shouldOpenEvidenceBlock(task) ? ' open' : '';
  return `<details class="drawer-details"${open}>
    <summary>证据与治理</summary>
    <div class="drawer-details-body">${html}</div>
  </details>`;
}

function shouldShowAgentCommand(task) {
  return (task._effective || task.status) !== 'in_progress';
}

function shouldOpenAgentCommand(task) {
  const status = task._effective || task.status;
  return status === 'todo';
}

function shouldOpenEvidenceBlock(task) {
  return ['done', 'review', 'cancelled'].includes(task.status);
}

function renderSmallList(items, emptyText) {
  if (!items?.length) return `<span>${esc(emptyText)}</span>`;
  return `<ul>${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>`;
}

function renderEvidenceBlock(task) {
  const hasEvidence = task.evidence?.length;
  const showVerification = task.verification || ['done', 'review'].includes(task.status);
  const showReview = task.review_status || task.status === 'review';
  const showCancel = task.status === 'cancelled';
  const showPriority = task.priority;
  const showUpdated = task.updated_at;
  if (!hasEvidence && !showVerification && !showReview && !showCancel && !showPriority && !showUpdated) return '';
  const reviewBadge = task.review_status ? `<span class="rev-badge rev-${esc(task.review_status)}">${reviewStatusLabel(task.review_status)}</span>` : '<span style="color:var(--muted);">未填写</span>';
  return `<div class="evidence-block">
    <div class="evidence-head"><strong>证据与治理</strong>
      ${showPriority ? `<span class="prio-pill prio-${esc(task.priority)}">${esc(task.priority)}</span>` : ''}
      ${showUpdated ? `<span class="evidence-meta">更新于 ${esc(task.updated_at)}</span>` : ''}
    </div>
    <div class="evidence-grid">
      <div class="field-box">
        <strong>完成证据</strong>
        ${renderSmallList(task.evidence, '未登记 evidence')}
      </div>
      ${showVerification ? `<div class="field-box">
        <strong>验证方式</strong>
        <span>${esc(task.verification || '未填写 verification')}</span>
      </div>` : ''}
      ${showReview ? `<div class="field-box">
        <strong>复核状态</strong>
        <span>${reviewBadge}</span>
      </div>` : ''}
      ${showCancel ? `<div class="field-box">
        <strong>取消原因</strong>
        <span>${esc(task.cancel_reason || task.resolution || '未填写 cancel_reason / resolution')}</span>
      </div>` : ''}
    </div>
  </div>`;
}

function reviewStatusLabel(s) { return {pending:'待复核', passed:'已通过', must_fix:'必须修', deferred:'延期复核'}[s] || s; }

function taskCardPath(task) {
  return task.source_file ? `.ganttmd/${task.source_file}` : '.ganttmd/tasks/*.md';
}

function getTaskSourceDocs(task) {
  return (task.source_docs || []).filter(doc => !String(doc).includes('.ganttmd/followups.md'));
}

function renderIssue(issue) {
  return `<div class="issue ${issue.level}">
    <span class="issue-id">${esc(issue.id)}</span>
    <span class="issue-text">${esc(issue.text)}</span>
    ${state.byId.has(issue.id) ? `<button class="issue-btn quick-focus" type="button" data-task-id="${esc(issue.id)}">定位</button>` : ''}
  </div>`;
}

function renderFollowupView() {
  const stats = getFollowupStats();
  const selectedKind = FOLLOWUP_KINDS.includes(state.followupKind) ? state.followupKind : 'all';
  const visibleFollowups = selectedKind === 'all' ? state.followups : state.followups.filter(f => getFollowupKind(f) === selectedKind);
  const groups = [...FOLLOWUP_STATUSES, 'invalid']
    .map(status => ({ status, items: visibleFollowups.filter(f => getFollowupStatus(f) === status) }))
    .filter(g => g.items.length);
  if (!state.followups.length) {
    return `<div class="empty"><strong>暂无 Follow-up</strong><p style="margin-top:8px;">Agent 发现后续事项后，应追加到 .ganttmd/followups.md。</p></div>`;
  }
  return `<div class="agent-card followup" style="margin-bottom:16px;">
    <div class="health-head"><strong>Follow-up 清单</strong><span>${state.followups.length} 个事项</span></div>
    <div class="agent-metrics" style="margin-top:0;">
      <span class="metric-pill">${stats.open} open</span>
      <span class="metric-pill">${stats.accepted} accepted</span>
      <span class="metric-pill">${stats.converted} converted</span>
      <span class="metric-pill">${stats.done} done</span>
      <span class="metric-pill">${stats.wontfix} wontfix</span>
      ${stats.invalid ? `<span class="metric-pill">${stats.invalid} invalid</span>` : ''}
    </div>
    ${renderFollowupKindFilters(selectedKind, stats)}
  </div>
  ${groups.length ? groups.map(g => `<div class="group">
    <div class="group-header ${g.status === 'open' ? 'blocked' : g.status === 'done' ? 'completed' : 'active'}">
      <span class="group-tag">${esc(g.status)}</span>
      <h3>${followupStatusLabel(g.status)}</h3>
      <span class="group-summary">${g.items.length} 项</span>
    </div>
    <div class="followup-grid">${g.items.map(renderFollowupCard).join('')}</div>
  </div>`).join('') : `<div class="empty"><strong>当前类型暂无事项</strong><p style="margin-top:8px;">可以切换其他 Follow-up 类型查看。</p></div>`}`;
}

function renderFollowupKindFilters(selectedKind, stats) {
  const items = [
    { id: 'all', label: '全部', count: state.followups.length },
    ...FOLLOWUP_KINDS.map(kind => ({ id: kind, label: followupKindLabel(kind), count: stats[kind] || 0 })),
  ];
  return `<div class="followup-filters">${items.map(item => `<button class="followup-filter ${selectedKind === item.id ? 'active' : ''}" type="button" data-kind="${esc(item.id)}">
    ${esc(item.label)} · ${item.count}
  </button>`).join('')}</div>`;
}

function renderFollowupCard(item) {
  const severity = item.severity || 'medium';
  const status = getFollowupStatus(item);
  return `<div class="followup-card status-${esc(status)}">
    <div class="followup-top">
      <div class="task-id">${esc(item.id || '')}</div>
      <span class="followup-severity ${esc(severity)}">${esc(severityLabel(severity))}</span>
    </div>
    <div class="followup-title">${esc(item.title || '')}</div>
    <div class="followup-kind">${esc(followupKindLabel(getFollowupKind(item)))}</div>
    <div class="followup-reason">${esc(item.reason || '')}</div>
    <div class="followup-meta">
      ${status === 'invalid' ? `<span class="followup-pill high">非法状态</span>` : ''}
      ${item.source_pr ? `<span class="followup-pill">${esc(item.source_pr)}</span>` : ''}
      ${item.source_rr ? `<span class="followup-pill">${esc(item.source_rr)}</span>` : ''}
      ${item.source_task ? `<span class="followup-pill">来源 ${esc(item.source_task)}</span>` : ''}
      ${item.target_milestone ? `<span class="followup-pill">${esc(item.target_milestone)}</span>` : ''}
      ${item.converted_task ? `<span class="followup-pill">转任务 ${esc(item.converted_task)}</span>` : ''}
    </div>
  </div>`;
}

function renderRiskView() {
  const blockedTasks = state.tasks.filter(t => t._effective === 'blocked');
  const activeFollowups = state.followups.filter(f => ['open', 'accepted', 'invalid'].includes(getFollowupStatus(f)));
  const decisionItems = activeFollowups.filter(f => getFollowupKind(f) === 'decision');
  const deferredItems = activeFollowups.filter(f => getFollowupKind(f) === 'deferred');
  const externalItems = activeFollowups.filter(f => getFollowupKind(f) === 'external_wait');
  const ordinaryFollowups = activeFollowups.filter(f => !['decision', 'deferred', 'external_wait'].includes(getFollowupKind(f)));
  const seriousIssues = getHealthIssues().filter(issue => issue.level === 'warn');
  const total = blockedTasks.length + activeFollowups.length + seriousIssues.length;
  return `<div class="agent-card health" style="margin-bottom:16px;">
    <div class="health-head"><strong>风险视图</strong><span>${total} 个待主控关注信号</span></div>
    <div class="agent-metrics" style="margin-top:0;">
      <span class="metric-pill">${blockedTasks.length} 阻塞任务</span>
      <span class="metric-pill">${activeFollowups.length} 未清理 Follow-up</span>
      <span class="metric-pill">${decisionItems.length} 用户裁决</span>
      <span class="metric-pill">${deferredItems.length} 延期复查</span>
      <span class="metric-pill">${externalItems.length} 外部等待</span>
      <span class="metric-pill">${seriousIssues.length} 严重提示</span>
    </div>
  </div>
  <div class="risk-grid">
    <div class="risk-card">
      <div class="risk-card-title">阻塞任务 <span>${blockedTasks.length} 项</span></div>
      ${renderRiskTaskList(blockedTasks)}
    </div>
    <div class="risk-card followup-risk">
      <div class="risk-card-title">等待用户裁决 <span>${decisionItems.length} 项</span></div>
      ${renderRiskFollowupList(decisionItems)}
    </div>
    <div class="risk-card followup-risk">
      <div class="risk-card-title">延期复查 <span>${deferredItems.length} 项</span></div>
      ${renderRiskFollowupList(deferredItems)}
    </div>
    <div class="risk-card followup-risk">
      <div class="risk-card-title">等待外部资料 <span>${externalItems.length} 项</span></div>
      ${renderRiskFollowupList(externalItems)}
    </div>
    <div class="risk-card followup-risk">
      <div class="risk-card-title">其他 Follow-up <span>${ordinaryFollowups.length} 项</span></div>
      ${renderRiskFollowupList(ordinaryFollowups)}
    </div>
    <div class="risk-card health-risk">
      <div class="risk-card-title">健康检查风险 <span>${seriousIssues.length} 项</span></div>
      ${renderRiskIssueList(seriousIssues)}
    </div>
  </div>`;
}

function renderRiskTaskList(tasks) {
  if (!tasks.length) return `<div class="risk-empty">暂无阻塞任务。</div>`;
  return `<div class="risk-list">${tasks.map(task => `<div class="risk-item">
    <strong>${esc(task.id)} ${esc(task.title || '')}</strong>
    <div>${esc(getTaskDiagnosis(task))}</div>
    <div class="risk-meta">
      <span>${esc(trackLabel(task._track))}</span>
      <span>${esc(moduleLabel(task._businessModule))}</span>
      <span>${esc(task.milestone || '无里程碑')}</span>
      <span>${task._openDeps.length} 个前置阻塞</span>
      ${task.blocked_reason ? `<span>外部阻塞</span>` : ''}
    </div>
    <div style="margin-top:7px;"><button class="inline-btn quick-focus" type="button" data-task-id="${esc(task.id)}">查看依赖</button></div>
  </div>`).join('')}</div>`;
}

function renderRiskFollowupList(items) {
  if (!items.length) return `<div class="risk-empty">暂无未清理 Follow-up。</div>`;
  return `<div class="risk-list">${items.map(item => {
    const status = getFollowupStatus(item);
    return `<div class="risk-item">
      <strong>${esc(item.id || '')} ${esc(item.title || '')}</strong>
      <div>${esc(item.reason || '')}</div>
      <div class="risk-meta">
        <span>${esc(status)}</span>
        <span>${esc(followupKindLabel(getFollowupKind(item)))}</span>
        <span>${esc(item.severity || 'medium')}</span>
        ${item.source_pr ? `<span>${esc(item.source_pr)}</span>` : ''}
        ${item.source_rr ? `<span>${esc(item.source_rr)}</span>` : ''}
        ${item.source_task ? `<span>来源 ${esc(item.source_task)}</span>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderRiskIssueList(issues) {
  if (!issues.length) return `<div class="risk-empty">暂无严重健康检查提示。</div>`;
  return `<div class="risk-list">${issues.map(issue => `<div class="risk-item">
    <strong>${esc(issue.id)}</strong>
    <div>${esc(issue.text)}</div>
    ${state.byId.has(issue.id) ? `<div style="margin-top:7px;"><button class="inline-btn quick-focus" type="button" data-task-id="${esc(issue.id)}">定位任务</button></div>` : ''}
  </div>`).join('')}</div>`;
}

function getFollowupStats() {
  const stats = { open: 0, accepted: 0, converted: 0, done: 0, wontfix: 0, invalid: 0, decision: 0, deferred: 0, external_wait: 0, risk: 0, followup: 0 };
  for (const f of state.followups) {
    stats[getFollowupStatus(f)]++;
    stats[getFollowupKind(f)]++;
  }
  return stats;
}

function getFollowupStatus(item) {
  const status = item.status || 'open';
  return FOLLOWUP_STATUSES.includes(status) ? status : 'invalid';
}

function followupStatusLabel(status) {
  return {open:'待主控清理', accepted:'主控已接受', converted:'已转正式任务', done:'已完成', wontfix:'不处理', invalid:'非法数据'}[status] || status;
}

function getFollowupKind(item) {
  if (item.kind && FOLLOWUP_KINDS.includes(item.kind)) return item.kind;
  if (item.decision_owner === 'user' || /用户|裁决|拍板/.test(`${item.title || ''} ${item.reason || ''}`)) return 'decision';
  if (item.next_review_at || item.status === 'accepted') return 'deferred';
  if (/外部|资料|设备|海康|等待|回复/.test(`${item.title || ''} ${item.reason || ''}`)) return 'external_wait';
  if (item.severity === 'high') return 'risk';
  return 'followup';
}

function followupKindLabel(kind) {
  return {followup:'普通 Follow-up', decision:'等待用户裁决', deferred:'延期复查', external_wait:'等待外部资料', risk:'高风险事项'}[kind] || kind;
}

function severityLabel(severity) {
  return {high:'高', medium:'中', low:'低'}[severity] || severity;
}

function getRecommendedTask() {
  const ready = state.tasks.filter(t => t._effective === 'todo');
  ready.sort((a, b) => getExecutionScore(b) - getExecutionScore(a) || (state.orderIdx.get(a.id) ?? 999) - (state.orderIdx.get(b.id) ?? 999));
  return ready[0] || null;
}

function getExecutionScore(task) {
  const directChildren = state.children.get(task.id) || [];
  const blockedChildren = directChildren.filter(id => state.byId.get(id)?._effective === 'blocked').length;
  const milestoneBias = task.milestone ? 1 : 0;
  return directChildren.length * 2 + blockedChildren * 3 + milestoneBias;
}

function getRecommendationReason(task) {
  const children = state.children.get(task.id) || [];
  const blockedChildren = children.filter(id => state.byId.get(id)?._effective === 'blocked');
  const cpSuffix = state.criticalSet.has(task.id) ? '（在关键路径上）' : '';
  if (blockedChildren.length) return `它没有未完成前置依赖，并且完成后可能解锁 ${blockedChildren.length} 个当前阻塞任务。${cpSuffix}`;
  if (children.length) return `它没有未完成前置依赖，并且完成后会影响 ${children.length} 个后续任务。${cpSuffix}`;
  return `它没有未完成前置依赖，适合作为 Agent 下一步直接领取的任务。${cpSuffix}`;
}

function getTaskDiagnosis(task) {
  if (task._missingDeps?.length) return `任务依赖数据不完整，缺失依赖：${task._missingDeps.join(', ')}。`;
  if (task.blocked_reason) return `当前任务存在外部阻塞：${task.blocked_reason}。`;
  if (task._effective === 'blocked') return `当前任务不能直接推进，需要先完成 ${task._openDeps.length} 个前置任务。`;
  if (task._effective === 'todo') return '当前任务没有未完成前置依赖，可以作为 Agent 下一步领取对象。';
  if (task._effective === 'in_progress') return task.owner || task.agent ? '当前任务已在推进中，继续前应确认最新上下文。' : '当前任务已在推进中，但缺少 owner/agent 标记，存在多 Agent 撞车风险。';
  if (task.status === 'review') return '当前任务已有产出，等待复核、PR 或用户判断。';
  if (task.status === 'done') return '当前任务已完成，重点检查验收证据和它解锁的后续任务。';
  if (task.status === 'cancelled') return '当前任务已取消，通常不进入默认推进队列。';
  return '当前任务状态可读取，但还缺少更细的接手字段。';
}

function getAgentHandoff(task) {
  if (task._missingDeps?.length) return '依赖数据有误，暂不建议执行。';
  if (task._effective === 'blocked') return `不建议领取，被 ${task._openDeps.length} 个前置任务阻塞。`;
  if (task._effective === 'todo') return '可领取。';
  if (task.status === 'in_progress') return task.owner || task.agent ? '进行中，接手前先确认上下文。' : '进行中，但缺少 owner/agent。';
  if (task.status === 'review') return '待复核，不建议直接继续实现。';
  if (task.status === 'done') return '已完成，适合复核证据或查看后续任务。';
  if (task.status === 'cancelled') return '已取消，不建议领取。';
  return '状态信息不足。';
}

function getBranchCommand(task) {
  const type = inferBranchType(task);
  const taskId = normalizeTaskId(task.id);
  const topic = inferBranchTopic(task);
  return `bash scripts/new-task.sh ${type} ${taskId || '-'} ${topic}`;
}

function inferBranchType(task) {
  const text = `${task.id || ''} ${task.title || ''} ${task.track || ''} ${task.domain || ''}`.toLowerCase();
  if (task.track === 'frontend' || task.track === 'backend') return 'feature';
  if (task.track === 'spec') return 'docs';
  if (text.includes('fix') || text.includes('修复') || text.includes('缺陷')) return 'fix';
  if (text.includes('refactor') || text.includes('重构')) return 'refactor';
  if (text.includes('ci') || text.includes('脚本') || text.includes('门禁')) return 'chore';
  if (task.track === 'quality' || task.track === 'ops' || task.track === 'infra') return 'chore';
  return 'docs';
}

function normalizeTaskId(id) {
  const normalized = String(id || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  return normalized || '-';
}

function inferBranchTopic(task) {
  const text = `${task.title || ''} ${task.next_action || ''} ${task.domain || ''}`.toLowerCase();
  const keywordTopics = [
    { keys: ['本地代理', '真实后端联调', 'vite_access_mode'], topic: 'frontend-backend-proxy' },
    { keys: ['scoperesolver', 'scope resolver', '查询端'], topic: 'scope-resolver-query' },
    { keys: ['escalation', '升级 run', '升级扫描'], topic: 'escalation-run' },
    { keys: ['物理落点', 'prisma'], topic: 'attendance-db-placement' },
    { keys: ['通知意图'], topic: 'notification-intent' },
    { keys: ['设备输入'], topic: 'device-input' },
    { keys: ['验收清单'], topic: 'acceptance-checklist' },
    { keys: ['部署', '运维'], topic: 'deployment-runbook' },
  ];
  const matched = keywordTopics.find(item => item.keys.some(key => text.includes(key)));
  if (matched) return matched.topic;

  const domainTopics = {
    safety_attendance: 'attendance',
    master_data: 'master-data',
    auth_permission: 'auth-scope',
    device_input: 'device-input',
    notification: 'notification',
    data_lifecycle: 'data-lifecycle',
    local_dev: 'local-dev',
    project_governance: 'project-governance',
    crosscutting: 'crosscutting',
    identity: 'identity',
  };
  if (task.domain && domainTopics[task.domain]) return domainTopics[task.domain];
  if (task.track === 'frontend') return 'frontend-task';
  if (task.track === 'backend') return 'backend-task';
  if (task.track === 'spec') return 'spec-task';
  if (task.track === 'quality') return 'quality-task';
  if (task.track === 'infra') return 'infra-task';
  return 'task';
}

function getAgentCommand(task) {
  const taskFile = taskCardPath(task);
  const sourceDocs = getTaskSourceDocs(task);
  const sources = sourceDocs.length ? sourceDocs.map(doc => `- ${doc}`).join('\n') : '- 任务卡已包含足够执行信息，按需再补正式依据文档';
  const nextAction = task.next_action || '按任务描述推进下一步工作';
  const scope = task.execution_scope || '按任务卡、source_docs 和当前任务所属模块执行；不得扩大到无关模块。';
  const outputTarget = task.output_target || '代码类任务写清改动模块、测试证据和 PR 说明；文档类任务写清主改文档、同步文档和任务卡证据；复查 / 调研类任务写清结论落点、未决项和 follow-up。';
  const acceptance = task.acceptance?.length ? task.acceptance.map((item, index) => `${index + 1}. ${item}`).join('\n') : '1. 补充本任务的验收标准\n2. 完成后补充 evidence';
  const constraints = task.downstream_constraints?.length ? task.downstream_constraints.map((item, index) => `${index + 1}. ${item}`).join('\n') : '1. 无额外下游约束；按任务卡和正式规范执行。';
  const verification = task.verification_commands?.length ? task.verification_commands.map((item, index) => `${index + 1}. ${item}`).join('\n') : '1. ganttmd validate\n2. git diff --check\n3. 按任务类型运行对应测试 / 文档检查；无法执行时写明原因和替代验证。';
  const branchCommand = getBranchCommand(task);
  if (task._missingDeps?.length) {
    return `任务 ${task.id} 的依赖数据不完整。\n\n开工入口：\n先按 AGENTS.md 和 docs/工程方法与规范/AI solo 项目运行工作流规范.md §0 执行。本任务涉及 Git / 分支时，按 docs/工程方法与规范/Git工作流与提交规范.md §0 路由执行。\n\n任务卡：\n${taskFile} 中的 ${task.id}。\n\n必读事实源：\n${sources}\n\n处理要求：\n修正 dependencies 中不存在的任务：${task._missingDeps.join(', ')}。\n修正后重新判断它是否可执行，不要直接开始实现。`;
  }
  if (task.blocked_reason) {
    return `不建议领取 ${task.id}：${task.title || ''}\n\n当前存在外部阻塞：\n${task.blocked_reason}。`;
  }
  if (task._effective === 'blocked') {
    return `不建议领取 ${task.id}：${task.title || ''}\n\n当前被 ${task._openDeps.length} 个前置任务阻塞：${task._openDeps.join(', ')}。`;
  }
  const cpText = state.criticalSet.has(task.id) ? '\n注意：本任务在关键路径上，延迟会直接影响里程碑交付。' : '';
  if (task._effective === 'todo') {
    return `你接手任务 ${task.id}：${task.title || ''}。\n\n开工入口：\n先按 AGENTS.md 和 docs/工程方法与规范/AI solo 项目运行工作流规范.md §0 执行。本任务涉及 Git / 分支时，按 docs/工程方法与规范/Git工作流与提交规范.md §0 路由执行。\n\n任务卡：\n${taskFile} 中的 ${task.id}。\n\n## 任务目标\n${nextAction}\n\n## 执行范围\n${scope}\n\n## 产出物 / 结果落点\n${outputTarget}\n\n## 验收重点\n${acceptance}\n\n## 边界 / 禁止事项\n${constraints}\n\n## 验证命令\n${verification}\n\n## 分支 / worktree 要求\n在独立 worktree 创建任务分支：\n\`\`\`bash\n${branchCommand}\n\`\`\`\n不得在主工作区或 master 上开发，项目主控类任务例外时必须明确说明。\n\n必读事实源：\n${sources}\n\n交付要求：\n更新任务卡 status / evidence / verification / review_status，并按工作流规范 §6 / §8 / §9 完成验证、PR 证据和回写。${cpText}`;
  }
  if (task.status === 'in_progress') {
    return `接续进行中任务 ${task.id}：${task.title || ''}。\n\n开工入口：\n先按 AGENTS.md 和 docs/工程方法与规范/AI solo 项目运行工作流规范.md §0 执行。本任务涉及 Git / 分支时，按 docs/工程方法与规范/Git工作流与提交规范.md §0 路由执行。\n\n任务卡：\n${taskFile} 中的 ${task.id}。\n\n## 任务目标\n${nextAction}\n\n## 执行范围\n${scope}\n\n## 产出物 / 结果落点\n${outputTarget}\n\n## 验收重点\n${acceptance}\n\n## 边界 / 禁止事项\n${constraints}\n\n## 验证命令\n${verification}\n\n## 分支 / worktree 要求\n核对当前 worktree / 分支 / owner / agent 与实际接手人是否一致；不一致先报告，不直接接续。\n\n必读事实源：\n${sources}\n\n接续要求：\n更新任务卡 status / evidence / verification / review_status，并按工作流规范 §6 / §8 / §9 完成验证、PR 证据和回写。${cpText}`;
  }
  if (task.status === 'review') {
    return `复核任务 ${task.id}：${task.title || ''}。\n\n开工入口：\n先按 AGENTS.md 和 docs/工程方法与规范/AI solo 项目运行工作流规范.md §0 执行；复核按工作流规范 §7 执行。\n\n任务卡：\n${taskFile} 中的 ${task.id}。\n\n## 任务目标\n复核本任务产出是否满足验收重点，并确认交付证据完整。\n\n## 执行范围\n${scope}\n\n## 产出物 / 结果落点\n复核结论进入 PR Notes / 任务卡 review_status；必须修的问题退回实现或登记 follow-up。\n\n## 验收重点\n${acceptance}\n\n## 边界 / 禁止事项\n${constraints}\n\n## 验证命令\n${verification}\n\n## 分支 / worktree 要求\n复核不得直接替产出代理扩大实现范围；需要修复时先明确问题和落点。\n\n必读事实源：\n${sources}\n\n复核要求：\n检查 evidence、verification 和 review_status 是否完整。如复核通过，将 status 更新为 done；如必须修，登记修复任务或退回 in_progress。${cpText}`;
  }
  if (task.status === 'done') {
    const downstream = state.children.get(task.id) || [];
    return `复核已完成任务 ${task.id}。\n读取任务卡：${taskFile}\n读取来源文档：${sources}\n检查 evidence 是否覆盖以下验收标准：\n${acceptance}\n若已确认完成，下一步关注它的后续任务：${downstream.length ? downstream.join(', ') : '暂无后续任务'}。`;
  }
  if (task.status === 'cancelled') {
    return `任务 ${task.id} 已取消。\n读取任务卡：${taskFile}\n读取来源文档：${sources}\n确认取消原因、剩余风险和是否需要登记 follow-up。`;
  }
  return `读取任务卡：${taskFile}\n读取来源文档：${sources}\n补充任务 ${task.id} 的 next_action、acceptance、owner/agent 等协作字段后再执行。`;
}

function getHealthIssues() {
  const issues = [...getFollowupIssues()];
  for (const t of state.tasks) {
    if (!TASK_STATUSES.includes(t.status)) {
      issues.push({ level: 'warn', id: t.id, text: `任务 status 非法：${t.status || '(空)'}` });
    }
    if (t._missingDeps?.length) {
      issues.push({ level: 'warn', id: t.id, text: `依赖指向不存在任务：${t._missingDeps.join(', ')}` });
    }
    if (t.status === 'blocked' && t._openDeps.length === 0 && !t.blocked_reason) {
      issues.push({ level: 'warn', id: t.id, text: '标记为 blocked，但没有未完成前置依赖，也没有 blocked_reason。' });
    }
    if (t.status === 'in_progress' && !t.owner && !t.agent) {
      issues.push({ level: '', id: t.id, text: '进行中任务缺少 owner/agent 字段，后续多 Agent 协作容易撞车。' });
    }
    if (t.status === 'review' && !t.review_status) {
      issues.push({ level: 'warn', id: t.id, text: 'review 任务缺少 review_status，无法判断复核结论。' });
    }
    if (t.status === 'done' && !t.evidence?.length) {
      issues.push({ level: 'warn', id: t.id, text: 'done 任务缺少 evidence，可能形成虚假闭环。' });
    }
    if (t.status === 'done' && ['backend', 'frontend', 'infra'].includes(t.track) && !t.verification) {
      issues.push({ level: 'warn', id: t.id, text: `${t.track} 任务已完成但缺少 verification。` });
    }
    if (t.status === 'cancelled' && !t.cancel_reason && !t.resolution) {
      issues.push({ level: 'warn', id: t.id, text: 'cancelled 任务缺少 cancel_reason 或 resolution。' });
    }
    if (!t.next_action) {
      issues.push({ level: '', id: t.id, text: '缺少 next_action，Agent 接手时只能依赖通用模板。' });
    }
    if (!t.acceptance?.length) {
      issues.push({ level: '', id: t.id, text: '缺少 acceptance，完成后不容易判断是否可验收。' });
    }
    const downstream = state.children.get(t.id) || [];
    if (downstream.length >= 2 && !t.downstream_constraints?.length && t.status !== 'done') {
      issues.push({ level: '', id: t.id, text: `有 ${downstream.length} 个下游任务但未填写 downstream_constraints，Agent 实现时可能做出对下游不兼容的设计决策。` });
    }
  }
  return issues;
}

function getFollowupIssues() {
  const issues = [];
  const commonRequired = ['id', 'title', 'status', 'source_type', 'created_by', 'created_at', 'reason', 'suggestion', 'severity'];
  for (const f of state.followups) {
    const id = f.id || 'FUP-UNKNOWN';
    const missing = commonRequired.filter(key => !f[key]);
    if (missing.length) {
      issues.push({ level: 'warn', id, text: `Follow-up 缺少字段：${missing.join(', ')}` });
    }
    if (getFollowupStatus(f) === 'invalid') {
      issues.push({ level: 'warn', id, text: `Follow-up status 非法：${f.status || '(空)'}` });
    }
    if (f.kind && !FOLLOWUP_KINDS.includes(f.kind)) {
      issues.push({ level: 'warn', id, text: `Follow-up kind 非法：${f.kind}` });
    }
    if (getFollowupKind(f) === 'decision' && !f.decision_owner) {
      issues.push({ level: 'warn', id, text: '用户裁决类 Follow-up 缺少 decision_owner。' });
    }
    const fStatus = getFollowupStatus(f);
    if (((getFollowupKind(f) === 'deferred' && ['open', 'accepted'].includes(fStatus)) || f.status === 'accepted') && !f.next_review_at) {
      issues.push({ level: 'warn', id, text: '延期或 accepted Follow-up 缺少 next_review_at。' });
    }
    if (f.source_type === 'pr_review' && (!f.source_pr || !f.source_rr)) {
      issues.push({ level: 'warn', id, text: 'PR 审查来源必须填写 source_pr 和 source_rr。' });
    }
    if (f.status === 'accepted') {
      const acceptedMissing = ['accepted_by', 'accepted_at', 'next_review_at', 'decision'].filter(key => !f[key]);
      if (acceptedMissing.length) {
        issues.push({ level: 'warn', id, text: `accepted 缺少主控复核字段：${acceptedMissing.join(', ')}` });
      }
    }
    if (f.status === 'converted' && (!f.converted_task || !f.resolution)) {
      issues.push({ level: 'warn', id, text: 'converted 必须填写 converted_task 和 resolution。' });
    }
    if ((f.status === 'done' || f.status === 'wontfix') && !f.resolution) {
      issues.push({ level: 'warn', id, text: `${f.status} 必须填写 resolution。` });
    }
  }
  return issues;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    const ok = document.execCommand('copy');
    textarea.remove();
    return ok;
  }
}

function groupByExecution() {
  const visibleTasks = getFilteredTasks();
  const ready = visibleTasks.filter(t => t._effective === 'todo').sort((a, b) => getExecutionScore(b) - getExecutionScore(a));
  const progress = visibleTasks.filter(t => t._effective === 'in_progress');
  const review = visibleTasks.filter(t => t._effective === 'review');
  const blocked = visibleTasks.filter(t => t._effective === 'blocked');
  const done = visibleTasks.filter(t => t.status === 'done');
  return [
    { id: 'NEXT', name: '可立即执行', status: ready.length ? 'in_progress' : 'backlog', tasks: ready },
    { id: 'DOING', name: '进行中', status: progress.length ? 'in_progress' : 'backlog', tasks: progress },
    { id: 'REVIEW', name: '待复核', status: review.length ? 'review' : 'backlog', tasks: review },
    { id: 'BLOCKED', name: '被阻塞', status: blocked.length ? 'blocked' : 'backlog', tasks: blocked },
    { id: 'DONE', name: '已完成', status: 'done', tasks: done },
  ].filter(g => g.tasks.length);
}

function groupByMilestone() {
  const milestones = state.config?.milestones || [];
  const groups = milestones.map(ms => ({ id: ms.id, name: ms.name, status: ms.status, tasks: [] }));
  const fallback = { id: '_other', name: '其他任务', status: 'backlog', tasks: [] };
  for (const t of getFilteredTasks()) {
    const group = groups.find(g => g.id === t.milestone) || fallback;
    group.tasks.push(t);
  }
  if (fallback.tasks.length) groups.push(fallback);
  return groups.filter(g => g.tasks.length).map(sortGroupTasks);
}

function groupByModule() {
  const groups = new Map();
  for (const task of getFilteredTasks()) {
    const id = task._businessModule || 'unknown';
    if (!groups.has(id)) groups.set(id, { id: moduleLabel(id), name: moduleLabel(id), status: 'in_progress', tasks: [] });
    groups.get(id).tasks.push(task);
  }
  return [...groups.values()]
    .filter(g => g.tasks.length)
    .map(sortGroupTasks);
}

function groupByTrack() {
  const order = ['spec', 'backend', 'frontend', 'infra', 'quality_gate'];
  const groups = new Map();
  for (const task of getFilteredTasks()) {
    const id = task._track || 'unknown';
    if (!groups.has(id)) groups.set(id, { id, name: trackLabel(id), status: 'in_progress', tasks: [] });
    groups.get(id).tasks.push(task);
  }
  return [...groups.values()]
    .sort((a, b) => {
      const ai = order.includes(a.id) ? order.indexOf(a.id) : 999;
      const bi = order.includes(b.id) ? order.indexOf(b.id) : 999;
      return ai - bi || a.name.localeCompare(b.name);
    })
    .map(sortGroupTasks);
}

function sortGroupTasks(group) {
  group.tasks.sort((a, b) => (state.orderIdx.get(a.id) ?? 999) - (state.orderIdx.get(b.id) ?? 999));
  return group;
}

function renderGroup(group) {
  const doneCnt = group.tasks.filter(t => t.status === 'done').length;
  const progressCnt = group.tasks.filter(t => t.status === 'in_progress').length;
  const readyCnt = group.tasks.filter(t => t._effective === 'todo').length;
  const blockedCnt = group.tasks.filter(t => t._effective === 'blocked').length;
  const pct = Math.round(doneCnt / group.tasks.length * 100);
  const summary = state.view === 'execution'
    ? `${group.tasks.length} 任务`
    : `${group.tasks.length} 任务 · ${doneCnt} 完成 · ${progressCnt} 进行中 · ${readyCnt} 可执行 · ${blockedCnt} 阻塞`;
  const middle = state.view === 'module'
    ? `<span class="group-summary">${summary}</span>`
    : state.view === 'execution'
    ? `<h3>${esc(group.name)}</h3><span class="group-summary">${summary}</span>`
    : `<h3>${esc(group.name)}</h3><span class="group-summary">${summary}</span>`;
  let headerCls = 'backlog';
  if (pct === 100) headerCls = 'completed';
  else if (group.status === 'in_progress' || group.tasks.some(t => t.status === 'in_progress')) headerCls = 'active';
  else if (group.status === 'review' || group.tasks.some(t => t.status === 'review')) headerCls = 'active';
  else if (group.status === 'blocked') headerCls = 'blocked';
  return `<div class="group">
    <div class="group-header ${headerCls}">
      <span class="group-tag">${esc(group.id === '_other' ? '?' : group.id)}</span>
      ${middle}
      ${state.view === 'execution' ? '' : `<span class="group-stats">${doneCnt}/${group.tasks.length} 完成 · ${pct}%</span>`}
    </div>
    <div class="task-cards">${renderCards(group.tasks)}</div>
  </div>`;
}

function renderCards(tasks) {
  let html = '';
  const focus = getFocusSets();
  const columns = getCardColumnCount();
  for (let rowStart = 0; rowStart < tasks.length; rowStart += columns) {
    const rowTasks = tasks.slice(rowStart, rowStart + columns);
    const focusIndex = rowTasks.findIndex(t => t.id === state.focusId);
    html += `<div class="task-row">${rowTasks.map(t => renderTaskCard(t, focus)).join('')}</div>`;
    if (focusIndex >= 0) {
      html += renderDependencyDrawer(state.byId.get(state.focusId) || rowTasks[focusIndex], focusIndex);
    }
  }
  return html;
}

function getCardColumnCount() {
  const content = document.getElementById('content');
  const width = content?.clientWidth || Math.max(320, window.innerWidth - 56);
  return Math.max(1, Math.floor((width + 10) / 242));
}

function renderTaskCard(t, focus) {
  const status = t._effective;
  const downstreamCount = state.children.get(t.id)?.length || 0;
  const relationClass = getRelationClass(t.id, focus);
  const onCritical = state.criticalSet.has(t.id);
  const hasConstraints = t.downstream_constraints?.length > 0;
  const expanded = t.id === state.focusId;
  const completedBranch = !t._worktreeBranch && t.status === 'done' && t.completed_branch;
  return `<div class="task-card-wrap ${expanded ? 'expanded' : ''}">
    <div class="task-card status-${status} ${relationClass}" data-task-id="${esc(t.id)}">
      <div class="task-head">
        <div class="task-id-row">
          <div class="task-id">${esc(t.id)}</div>
          ${t.priority ? `<span class="prio-pill prio-${esc(t.priority)}">${esc(t.priority)}</span>` : ''}
        </div>
        <span class="badge ${status}">${statusLabel(status)}</span>
      </div>
      <div class="task-name">${esc(t.title || '')}</div>
      <div class="task-meta">
        <span class="mod-tag">${esc(trackLabel(t._track))}</span>
        <span class="mod-tag">${esc(moduleLabel(t._businessModule))}</span>
      </div>
      ${t._worktreeBranch ? `<div class="branch-row"><span class="branch-tag">${esc(t._worktreeBranch)}</span></div>` : ''}
      ${completedBranch ? `<div class="branch-row"><span class="completed-branch-tag">完成分支 ${esc(t.completed_branch)}</span></div>` : ''}
      <div class="rel-row">
        ${onCritical ? `<span class="rel-pill cp">关键路径</span>` : ''}
        ${t._openDeps.length ? `<span class="rel-pill warn">↑${t._openDeps.length} 阻塞</span>` : ''}
        ${downstreamCount ? `<span class="rel-pill">↓${downstreamCount} 后续</span>` : ''}
        ${hasConstraints ? `<span class="rel-pill" style="border-color:#fde68a;background:#fffbeb;color:#b45309;">⚠${t.downstream_constraints.length} 约束</span>` : ''}
      </div>
    </div>
    </div>`;
}

function renderDependencyDrawer(task, focusIndex = 0) {
  if (!task) return '';
  const blockerIds = task._openDeps || [];
  const satisfiedIds = task.dependencies.filter(id => !blockerIds.includes(id));
  const downstreamIds = state.children.get(task.id) || [];
  const manualBlockers = task.blocked_reason ? [task.blocked_reason] : [];
  const arrowLeft = focusIndex * 242 + 108;
  return `<div class="dep-drawer-wrap"><div class="dep-drawer" style="--drawer-arrow-left:${arrowLeft}px">
    <div class="dep-drawer-head">
      <strong>正在查看：${esc(task.id)}</strong>
      <span>${esc(task.title || '')}</span>
    </div>
    <div class="dep-drawer-summary">
      <span class="metric-pill">${statusLabel(task._effective || task.status)}</span>
      <span class="metric-pill">${blockerIds.length + manualBlockers.length} 个阻塞来源</span>
      <span class="metric-pill">${satisfiedIds.length} 个已满足依赖</span>
      <span class="metric-pill">${downstreamIds.length} 个后续任务</span>
      ${state.criticalSet.has(task.id) ? `<span class="metric-pill" style="border-color:#c7d2fe;background:#eef2ff;color:var(--accent);font-weight:700;">关键路径</span>` : ''}
    </div>
    <div class="dep-inspect">${renderDrawerTaskContent(task)}</div>
  </div></div>`;
}

function renderDependencyList(ids, emptyText) {
  if (!ids.length) return `<div class="dep-empty">${esc(emptyText)}</div>`;
  return `<div class="dep-list">${ids.map(id => {
    const dep = state.byId.get(id);
    if (!dep) return `<div class="dep-item"><span class="dep-id">${esc(id)}</span><span class="dep-name">未找到任务</span><span class="dep-status blocked">缺失</span></div>`;
    const status = dep._effective || dep.status;
    return `<div class="dep-item">
      <span class="dep-id">${esc(dep.id)}</span>
      <span class="dep-name" title="${esc(dep.title || '')}">${esc(dep.title || '')}</span>
      <span class="dep-status ${status}">${statusLabel(status)}</span>
    </div>`;
  }).join('')}</div>`;
}

function renderBlockerList(task, blockerIds, manualBlockers) {
  const parts = [];
  if (blockerIds.length) parts.push(renderDependencyList(blockerIds, ''));
  if (manualBlockers.length) {
    parts.push(`<div class="dep-list">${manualBlockers.map(text => `<div class="dep-item">
      <span class="dep-id">外部</span>
      <span class="dep-name">${esc(text)}</span>
      <span class="dep-status blocked">被阻塞</span>
    </div>`).join('')}</div>`);
  }
  return parts.length ? parts.join('') : `<div class="dep-empty">暂无未完成的前置依赖</div>`;
}

function getFocusSets() {
  if (!state.focusId) return null;
  return {
    current: state.focusId,
    upstream: collectUpstream(state.focusId),
    downstream: collectDownstream(state.focusId),
  };
}

function collectUpstream(id, seen = new Set()) {
  const task = state.byId.get(id);
  if (!task) return seen;
  for (const dep of task.dependencies) {
    if (seen.has(dep)) continue;
    seen.add(dep);
    collectUpstream(dep, seen);
  }
  return seen;
}

function collectDownstream(id, seen = new Set()) {
  for (const child of state.children.get(id) || []) {
    if (seen.has(child)) continue;
    seen.add(child);
    collectDownstream(child, seen);
  }
  return seen;
}

function getRelationClass(id, focus) {
  if (!focus) return '';
  if (id === focus.current) return 'focus-current';
  const current = state.byId.get(focus.current);
  if (current?._openDeps?.includes(id)) return 'focus-blocker';
  if (focus.upstream.has(id)) return 'focus-upstream';
  if (focus.downstream.has(id)) return 'focus-downstream';
  return 'dimmed';
}

function statusLabel(s) { return {done:'已完成',in_progress:'进行中',todo:'可执行',review:'待复核',cancelled:'已取消',blocked:'被阻塞'}[s]||s; }
function checklistStatusLabel(s) { return {done:'已完成',skipped:'已跳过',in_progress:'进行中',todo:'待处理',review:'待复核',blocked:'被阻塞'}[s]||s; }
function esc(v) { return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function initApp() {
  try {
    if (window.GANTTMD_STATIC_STATE) {
      loadFromRuntimeState(window.GANTTMD_STATIC_STATE);
      return;
    }
    const match = location.pathname.match(/^\/project\/(.+)$/);
    if (match) {
      await loadProjectState(decodeURIComponent(match[1]));
    } else {
      await renderProjectListPage();
    }
  } catch (error) {
    console.error(error);
    document.getElementById('content').innerHTML = `<pre>${esc(error.stack || error.message)}</pre>`;
  }
}

initApp();
</script>
