project:
  id: acme-notes
  name: Acme Notes 样例

views:
  enabled: [execution, milestone, track, module, risk, followup]
  default: execution

validation:
  review_stale_days: 3650
  archive_after_days: 7

milestones:
  - id: M1
    name: 产品骨架
    status: done
    description: 明确产品目标、基础页面、API 骨架和校验入口
    objective: 展示已完成任务、证据链和工程验证

  - id: M2
    name: 协作编辑
    status: in_progress
    description: 完成编辑器、同步 API、协作状态和用户文档
    objective: 展示进行中任务、review 任务、checklist、run 和依赖阻塞

  - id: M3
    name: 发布准备
    status: todo
    description: 补齐端到端测试、发布检查和审计能力
    objective: 展示跨主线依赖、风险 follow-up 和延期事项

  - id: M4
    name: 后续增强
    status: todo
    description: 评估低优先级增强和已取消方案
    objective: 展示取消任务、wontfix follow-up 和未来能力边界
