ganttmd:
  schema_version: 1

project:
  id: jwxt
  name: 教务系统主控看板
  description: 从 jwxt 项目总控、执行待办、模块推进、跨域总账和升级门总账抽取的 GanttMD 主控视图
  source: /Users/gpp/project/gitee/jwxt

views:
  enabled: [execution, milestone, track, module, risk, followup]
  default: execution

milestones:
  - id: M0
    name: 顶层基线与文档治理成型
    status: done
    description: 产品、范围、技术、前后端设计和核心数据模型有稳定首轮口径，总控看板和执行待办可用
    objective: 01 / 02 / 03 / 05 / 06 有稳定首轮口径；总控看板和执行待办可用，后续只做持续复核

  - id: M1
    name: 核心模块规格首轮收敛
    status: in_progress
    description: 核心模块主规格、字段字典、接口清单和跨域依赖首轮关闭
    objective: 六模块 P0 接口契约全部关闭，考勤字段和跨域依赖有稳定结论，后续实现任务不再因规格歧义返工

  - id: M2
    name: 工程跑道建立
    status: in_progress
    description: 后端工程、数据库迁移、本地依赖、一键启动、CI 和工程规范跑道
    objective: 任何 Agent 或开发者拿到业务任务后，能直接在本地跑通开发-测试-提交流程，不需要再花时间搭环境

  - id: M3
    name: 系统底座最小实现
    status: backlog
    description: User / UserAccount / Profile / Organization / Permission / ScopeResolver / SystemConfig / AuditLog 最小 API 可运行
    objective: 系统身份、组织权限、配置和审计底座具备最小 API，可承接主数据和业务纵切

  - id: M4
    name: 主数据最小闭环
    status: backlog
    description: 学生、班级、教师、学生归班、教师责任关系具备最小 API 和管理端页面
    objective: 主数据能完成最小增删改查、关系维护和管理端页面闭环，为考勤和后续业务提供稳定对象

  - id: M5
    name: 安全到校第一条纵切
    status: in_progress
    description: 登录、主数据、权限、模拟设备、到校事实、异常关闭、审计和工作台展示最小闭环
    objective: 用模拟设备触发一次完整的到校事件，后端记录事实，前端工作台展示状态，异常可关闭，审计可追溯。这条链路验证整个技术栈端到端可用

  - id: M6
    name: 考勤第一阶段扩展
    status: backlog
    description: 安全到校、在校、离校、归寝、请假 / 销假 / 补录 / 异常关闭、通知意图形成统一链路
    objective: 在 M5 首条纵切稳定后，扩展到考勤第一阶段完整状态链路和通知意图闭环

  - id: M7
    name: 统计与审计成型
    status: backlog
    description: 指标口径、审计查询、导出、监管视图和统计投影
    objective: 校方管理员能按日/周/月查看到校统计，审计记录可按事件回溯，监管视图可导出合规报表

  - id: M8
    name: 真实设备接入与 V1 收敛
    status: backlog
    description: 真实设备事件替换模拟事件，完成设备专项、联调和 V1 收敛
    objective: 模拟设备全部替换为真实硬件事件源，系统在真实设备环境下完成联调，达到 V1 可交付状态
